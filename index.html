<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>检修剂量场仿真系统</title>
  <style>
    :root { --bg:#0f141b; --panel:#1a2230; --panel2:#222d3f; --fg:#dbe4f0; --dim:#8fa0b8; --accent:#4da3ff; --warn:#ff5a5a; --ok:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); display:flex; height:100vh; overflow:hidden; }
    nav { width:180px; background:var(--panel); padding:12px 0; flex-shrink:0; display:flex; flex-direction:column; }
    nav h1 { font-size:15px; padding:0 16px 12px; margin:0; color:var(--accent); }
    nav a { display:block; padding:9px 16px; color:var(--fg); text-decoration:none; border-left:3px solid transparent; }
    nav a.active { background:var(--panel2); border-left-color:var(--accent); }
    nav a:hover { background:var(--panel2); }
    #progress-wrap { margin-top:auto; padding:10px 16px; font-size:12px; color:var(--dim); }
    #progress-bar { height:4px; background:#333; border-radius:2px; margin-top:4px; }
    #progress-bar > div { height:100%; background:var(--accent); border-radius:2px; width:0%; transition:width .2s; }
    main { flex:1; overflow:auto; padding:16px; position:relative; }
    .panel { background:var(--panel); border-radius:8px; padding:14px; margin-bottom:14px; }
    .panel h2 { margin:0 0 10px; font-size:15px; color:var(--accent); }
    button { background:var(--panel2); color:var(--fg); border:1px solid #3a4a63; border-radius:5px; padding:5px 12px; cursor:pointer; font-size:13px; }
    button:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); color:#06121f; border-color:var(--accent); font-weight:600; }
    button.danger { border-color:var(--warn); color:var(--warn); }
    input, select { background:#0d1219; color:var(--fg); border:1px solid #3a4a63; border-radius:4px; padding:4px 8px; font-size:13px; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { border-bottom:1px solid #2a3648; padding:5px 8px; text-align:left; }
    th { color:var(--dim); font-weight:600; }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .warn { color:var(--warn); font-weight:600; }
    .ok { color:var(--ok); }
    .dim { color:var(--dim); }
    .view3d { width:100%; height:480px; border-radius:8px; overflow:hidden; background:#000; position:relative; }
    .view3d canvas { display:block; }
    .hint { position:absolute; left:10px; top:8px; font-size:12px; color:#cbd5e1; background:rgba(0,0,0,.45); padding:3px 8px; border-radius:4px; pointer-events:none; }
    .split { display:grid; grid-template-columns: 1fr 360px; gap:14px; }
    @media (max-width:1100px){ .split{ grid-template-columns:1fr; } }
    .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:var(--panel2); }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <main id="main"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
